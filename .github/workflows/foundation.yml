name: Chronos CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: chronos_ci
          POSTGRES_DB: chronos_ci
          POSTGRES_PASSWORD: ci-ephemeral-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U chronos_ci -d chronos_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CHRONOS_TEST_DATABASE_URL: postgresql://chronos_ci:ci-ephemeral-only@localhost:5432/chronos_ci
      CHRONOS_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy
      - run: uv run --no-sync pytest -q -m "not compose"
      - run: uv run --no-sync pip-audit --skip-editable
      - run: uv run --no-sync alembic -c backend/alembic.ini heads
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --audit-level=high
  containers:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-ephemeral-only
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --profile foundation config --quiet
      - run: docker compose --profile foundation build
  worker-processes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CHRONOS_RUN_COMPOSE_TESTS: "1"
      POSTGRES_PASSWORD: ci-build-configuration-only
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked
      - run: docker compose --profile workers build worker-1
      - run: uv run --no-sync pytest -q -m compose tests/process --junitxml=reports/worker-processes.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worker-process-evidence
          path: reports/
          retention-days: 14
