[project]
name = "chronos-distributed-scheduler"
version = "0.1.0"
description = "PostgreSQL-backed distributed scheduling infrastructure"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2,<3",
  "pydantic-settings>=2,<3",
  "sqlalchemy>=2,<3",
  "alembic>=1,<2",
  "psycopg[binary]>=3,<4",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=1,<2",
  "httpx>=0.28,<1",
  "ruff>=0.11,<1",
  "mypy>=1,<2",
  "testcontainers[postgres]>=4,<5",
  "locust>=2,<3",
  "httpx2>=2.16.0",
  "pip-audit>=2.10.1",
]

[build-system]
requires = ["hatchling>=1,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/chronos"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["backend/src", "tests/unit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires CHRONOS_TEST_DATABASE_URL pointing at a disposable PostgreSQL database"]
